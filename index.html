<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Simple Web Mic Streamer</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #222; color: #fff; }
        button { font-size: 20px; padding: 15px 30px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
        .btn-send { background: #ff4757; color: white; }
        .btn-recv { background: #2ed573; color: white; }
        #status { margin-top: 20px; font-size: 18px; color: #ffa502; }
    </style>
</head>
<body>
    <h1>スマホマイク -> PC 直結ストリーマー</h1>
    <p>スマホでは「送信」、PCでは「受信」を押してください</p>
    
    <button class="btn-send" onclick="startSending()">1. スマホ側：マイク音声を送信する</button>
    <br>
    <button class="btn-recv" onclick="startReceiving()">2. PC側：音声を受信する</button>
    
    <div id="status">ステータス: 待機中</div>
    <audio id="remoteAudio" autoplay></audio>

    <!-- 超軽量のP2P接続ライブラリ (PeerJS) を使用 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
        // 部屋のID（URLの末尾 ?room=〇〇 で変えられるようにする、デフォルトは 'my-mic-room-123'）
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'my-mic-room-123';
        
        const isSender = window.location.hash === '#send';
        let peer, localStream;

        function updateStatus(msg) {
            document.getElementById('status').innerText = "ステータス: " + msg;
            console.log(msg);
        }

        // --- スマホ（送信側）の処理 ---
        async function startSending() {
            try {
                updateStatus("マイクのアクセスを求めています...");
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // スマホ側には絶対に音が跳ね返らないようにする（自分は無音）
                // 送信側は自分のマイク音を再生しないため、audio要素は不要

                updateStatus("サーバーに接続中...");
                peer = new Peer('sender-' + roomId);

                peer.on('open', (id) => {
                    updateStatus("送信スタンバイ完了！ PC側で受信ボタンを押してください（ID: " + roomId + "）");
                });

                // PC側からの接続を待つ
                peer.on('connection', (conn) => {});
                peer.on('call', (call) => {
                    updateStatus("PCと接続しました！音声を送信中...");
                    call.answer(localStream); // マイク音声を返す
                });

            } catch (err) {
                alert("エラー: " + err.message);
            }
        }

        // --- PC（受信側）の処理 ---
        function startReceiving() {
            updateStatus("受信サーバーに接続中...");
            peer = new Peer();

            peer.on('open', (id) => {
                updateStatus("スマホ（送信側）に接続を試みています...");
                
                // スマホ（sender-ルームID）へ発信
                const call = peer.call('sender-' + roomId, new MediaStream());

                call.on('stream', (remoteStream) => {
                    updateStatus("接続成功！スマホの音声を受信中（携帯側は無音です）");
                    const audioEl = document.getElementById('remoteAudio');
                    audioEl.srcObject = remoteStream;
                    
                    // ※ここでPC側のブラウザ出力先を「CABLE Input」にしておけば、
                    //   そのままPCアプリ（Discord等）のマイクに入力されます！
                });

                call.on('error', (err) => {
                    alert("接続エラー: スマホ側がまだ「送信」を開始していない可能性があります。");
                });
            });
        }
    </script>
</body>
</html>
