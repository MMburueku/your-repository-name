<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホマイク・ワイヤレス中継（常時接続版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS WebRTCライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-xl font-bold mb-1 text-center text-indigo-400">スマホマイク中継器</h1>
        <p class="text-xs text-slate-400 mb-5 text-center">バックグラウンド動作対応版</p>

        <!-- タブ切り替えボタン -->
        <div class="grid grid-cols-2 gap-2 mb-5 bg-slate-900 p-1 rounded-lg">
            <button type="button" id="tabTx" onclick="clickSwitchTab('tx')" class="py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow">
                スマホ（送信）
            </button>
            <button type="button" id="tabRx" onclick="clickSwitchTab('rx')" class="py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
                PC（受信）
            </button>
        </div>

        <!-- ルームID入力エリア -->
        <div class="mb-5 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
            <label class="block text-xs font-semibold text-slate-400 mb-1">合言葉（ルームID）</label>
            <div class="flex gap-2">
                <input type="text" id="roomId" value="train-mic-777" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="clickRandomId()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs font-medium">自動生成</button>
            </div>
        </div>

        <!-- パネル1：スマホ（送信側） -->
        <div id="panelTx" class="space-y-4">
            <div class="text-xs text-slate-300 leading-relaxed bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                <strong>スマホ側の操作:</strong><br>
                1. 「送信を開始」を押すと、無音のキープ音が再生され、他のアプリを開いてもマイクが切れなくなります。
            </div>
            <button type="button" id="btnStartTx" onclick="clickStartTransmitter()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                マイク送信を開始
            </button>
            <div id="statusTx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>

        <!-- パネル2：PC（受信側） -->
        <div id="panelRx" class="space-y-4 hidden">
            <div class="text-xs text-slate-300 leading-relaxed bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                <strong>PC側の操作:</strong><br>
                1. 一覧を読み込んで「CABLE Input」を選択<br>
                2. 「受信を開始」を押す
            </div>

            <button type="button" onclick="loadAudioOutputs()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg transition text-xs shadow">
                1. スピーカー/出力デバイスの一覧を読み込む
            </button>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">出力先（CABLE Input）</label>
                <select id="audioOutputSelect" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-xs text-white">
                    <option value="">(まずは上のボタンを押してください)</option>
                </select>
            </div>

            <button type="button" id="btnStartRx" onclick="clickStartReceiver()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                2. 受信を開始（接続待ち）
            </button>
            <div id="statusRx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>
    </div>

    <!-- 音声再生タグ（PC用） -->
    <audio id="remoteAudio" autoplay class="hidden"></audio>
    
    <!-- スマホ用：バックグラウンドで生き残るための無音キープオーディオ -->
    <audio id="keepAliveAudio" loop class="hidden"></audio>

    <script>
        let peerInstance = null;
        let localMicStream = null;

        function clickSwitchTab(mode) {
            const tabTx = document.getElementById('tabTx');
            const tabRx = document.getElementById('tabRx');
            const panelTx = document.getElementById('panelTx');
            const panelRx = document.getElementById('panelRx');

            if (mode === 'tx') {
                tabTx.className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                tabRx.className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                panelTx.classList.remove('hidden');
                panelRx.classList.add('hidden');
            } else {
                tabRx.className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                tabTx.className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                panelRx.classList.remove('hidden');
                panelTx.classList.add('hidden');
            }
        }

        function clickRandomId() {
            const rand = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('roomId').value = 'mic-' + rand;
        }

        async function loadAudioOutputs() {
            const select = document.getElementById('audioOutputSelect');
            select.innerHTML = '<option value="">読み込み中...</option>';

            try {
                if (navigator.mediaDevices && typeof navigator.mediaDevices.selectAudioOutput === 'function') {
                    await navigator.mediaDevices.selectAudioOutput().catch(() => {});
                }
                const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {});
                if (tempStream) tempStream.getTracks().forEach(t => t.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(d => d.kind === 'audiooutput');

                select.innerHTML = '<option value="">(デフォルト出力)</option>';
                audioOutputs.forEach(device => {
                    const opt = document.createElement('option');
                    opt.value = device.deviceId;
                    opt.textContent = device.label || `スピーカー (${device.deviceId.slice(0, 5)}...)`;
                    select.appendChild(opt);
                });
                alert('デバイス一覧を読み込みました！');
            } catch (e) {
                select.innerHTML = '<option value="">(取得失敗)</option>';
            }
        }

        // --- スマホ（送信側：バックグラウンド対応） ---
        async function clickStartTransmitter() {
            const rawId = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusTx');
            const btn = document.getElementById('btnStartTx');
            const keepAlive = document.getElementById('keepAliveAudio');

            if (!rawId) { alert('合言葉を入力してください'); return; }

            btn.disabled = true;
            status.innerText = 'マイクを取得中...';

            try {
                // スマホのマイクを取得
                localMicStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                    video: false
                });

                // 【超重要】OSに「今音楽・音声を再生中だ」と錯覚させ、バックグラウンドでのスリープを防ぐための無音データを生成してループ再生
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.001; // ほぼ無音
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();

                // iOS/Android向けにサイレントオーディオ要素も再生
                keepAlive.src = "data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
                keepAlive.play().catch(() => {});

                status.innerText = '通信サーバー接続中...';
                if (peerInstance) peerInstance.destroy();
                peerInstance = new Peer();

                peerInstance.on('open', () => {
                    status.innerText = 'PC側へ接続を試みています...';
                    const targetRxId = 'rx-' + rawId;
                    const call = peerInstance.call(targetRxId, localMicStream);

                    if (!call) {
                        status.innerText = '❌ PC側が見つかりません。PC側で先に「受信を開始」を押してください';
                        btn.disabled = false;
                        return;
                    }
                    status.innerText = '🟢 送信中！ (他のアプリを開いても動作します)';
                });

                peerInstance.on('error', (err) => {
                    status.innerText = 'エラー: ' + err.type;
                    btn.disabled = false;
                });
            } catch (err) {
                status.innerText = '❌ エラー: マイクの許可が必要です';
                btn.disabled = false;
            }
        }

        // --- PC（受信側） ---
        function clickStartReceiver() {
            const rawId = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusRx');
            const btn = document.getElementById('btnStartRx');
            const selectedDeviceId = document.getElementById('audioOutputSelect').value;
            const remoteAudio = document.getElementById('remoteAudio');

            if (!rawId) { alert('合言葉を入力してください'); return; }

            btn.disabled = true;
            status.innerText = '受信用IDを準備中...';

            const myRxId = 'rx-' + rawId;
            if (peerInstance) peerInstance.destroy();
            peerInstance = new Peer(myRxId);

            peerInstance.on('open', () => {
                status.innerText = '🟢 受信待機中！ スマホで送信を開始してください';
            });

            peerInstance.on('call', (call) => {
                status.innerText = 'スマホから接続がありました！';
                call.answer();

                call.on('stream', async (remoteStream) => {
                    remoteAudio.srcObject = remoteStream;

                    if (selectedDeviceId && typeof remoteAudio.setSinkId === 'function') {
                        try {
                            await remoteAudio.setSinkId(selectedDeviceId);
                            status.innerText = '🟢 音声受信中！（CABLE Inputへ常時ルーティング中）';
                        } catch (e) {
                            status.innerText = '🟢 音声受信中！（デフォルト出力）';
                        }
                    } else {
                        status.innerText = '🟢 音声受信中！';
                    }
                });
            });

            peerInstance.on('error', (err) => {
                status.innerText = 'エラー: ' + err.type;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
