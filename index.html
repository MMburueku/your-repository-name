<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホマイク中継器（サイト完結・音声専用抽出ミキサー）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS WebRTCライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-xl font-bold mb-1 text-center text-indigo-400">スマホマイク中継器</h1>
        <p class="text-xs text-slate-400 mb-5 text-center">サイト完結型・音声専用抽出ミキサー</p>

        <!-- タブ切り替えボタン -->
        <div class="grid grid-cols-2 gap-2 mb-5 bg-slate-900 p-1 rounded-lg">
            <button type="button" id="tabTx" class="py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow">
                スマホ（送信）
            </button>
            <button type="button" id="tabRx" class="py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
                PC（受信）
            </button>
        </div>

        <!-- ルームID入力エリア -->
        <div class="mb-5 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
            <label class="block text-xs font-semibold text-slate-400 mb-1">合言葉（ルームID）</label>
            <div class="flex gap-2">
                <input type="text" id="roomId" value="mic-room-777" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="button" id="btnGenId" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs font-medium">自動生成</button>
            </div>
        </div>

        <!-- パネル1：スマホ（送信側） -->
        <div id="panelTx" class="space-y-4">
            <div class="text-xs text-slate-300 bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                ※同じWi-Fiに接続してご利用ください。
            </div>

            <!-- スマホマイク音量スライダー -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-300">🎤 スマホマイク音量ブースト</label>
                    <span id="gainValue" class="text-xs font-mono font-bold text-indigo-400">100%</span>
                </div>
                <input type="range" id="gainSlider" min="0" max="8" step="0.2" value="1" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <button type="button" id="btnStartTx" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                マイク送信を開始
            </button>
            <div id="statusTx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>

        <!-- パネル2：PC（受信側） -->
        <div id="panelRx" class="space-y-4 hidden">
            <!-- リアルタイムVUメーター -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 space-y-2">
                <div class="text-xs font-semibold text-slate-300 mb-1">📊 リアルタイム音声レベル（VUメーター）</div>
                <div>
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>📱 スマホマイク受信レベル</span>
                        <span id="micVuText">0%</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                        <div id="micVuBar" class="bg-emerald-500 h-full w-0 transition-all duration-75"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span>🎵 PC音声キャプチャレベル</span>
                        <span id="sysVuText">0%</span>
                    </div>
                    <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                        <div id="sysVuBar" class="bg-indigo-500 h-full w-0 transition-all duration-75"></div>
                    </div>
                </div>
            </div>

            <!-- アプリ・タブ音声抽出機能 -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-200 cursor-pointer" for="mixSystemAudio">
                        🎛️ PCアプリ・タブの音声を内部抽出
                    </label>
                    <input type="checkbox" id="mixSystemAudio" class="w-4 h-4 accent-indigo-500 cursor-pointer">
                </div>
                
                <div id="sourceTargetContainer" class="hidden space-y-3 pt-2 border-t border-slate-800">
                    <button type="button" id="btnSelectSource" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded text-xs font-bold transition flex items-center justify-center gap-1">
                        🎯 抜き取るアプリ・タブを選択
                    </button>
                    <div id="selectedSourceLabel" class="text-[11px] text-indigo-300 font-mono text-center truncate">選択中: 未選択</div>

                    <!-- PC音声専用音量調整スライダー -->
                    <div class="bg-slate-950/60 p-2.5 rounded border border-slate-800">
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-[11px] font-semibold text-slate-300">🔊 PC音声の音量調整</label>
                            <span id="sysGainValue" class="text-[11px] font-mono font-bold text-indigo-400">100%</span>
                        </div>
                        <input type="range" id="sysGainSlider" min="0" max="3" step="0.1" value="1" class="w-full accent-indigo-500 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">出力デバイス選択（Discord用仮想ケーブル等）</label>
                <select id="audioOutputSelect" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <option value="">(読み込み中...)</option>
                </select>
            </div>

            <button type="button" id="btnStartRx" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                受信スタンバイを開始
            </button>
            <div id="statusRx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>
    </div>

    <!-- 音声再生エレメント -->
    <audio id="remoteAudio" autoplay class="hidden"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let peer = null;
            let audioCtx = null;
            let micGainNode = null;
            let sysGainNode = null;
            let micAnalyser = null;
            let sysAnalyser = null;
            let systemStream = null;

            let isTransmitting = false;
            let isReceiving = false;
            let micGainValue = 1.0;
            let sysGainValue = 1.0;
            let mixSystemAudioEnabled = false;

            const peerConfig = { config: { iceServers: [] } };

            // UIタブ切り替え
            document.getElementById('tabTx').addEventListener('click', () => {
                document.getElementById('tabTx').className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                document.getElementById('tabRx').className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                document.getElementById('panelTx').classList.remove('hidden');
                document.getElementById('panelRx').classList.add('hidden');
            });

            document.getElementById('tabRx').addEventListener('click', () => {
                document.getElementById('tabRx').className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                document.getElementById('tabTx').className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                document.getElementById('panelRx').classList.remove('hidden');
                document.getElementById('panelTx').classList.add('hidden');
            });

            // 自動ID生成
            document.getElementById('btnGenId').addEventListener('click', () => {
                const rand = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('roomId').value = 'mic-' + rand;
            });

            // 出力デバイス読み込み
            async function loadDevices() {
                const select = document.getElementById('audioOutputSelect');
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const outputs = devices.filter(d => d.kind === 'audiooutput');
                    select.innerHTML = '<option value="">(デフォルトスピーカー)</option>';
                    outputs.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `スピーカー (${d.deviceId.slice(0, 5)}...)`;
                        select.appendChild(opt);
                    });
                } catch (e) {}
            }
            loadDevices();

            // 音量スライダーイベント
            document.getElementById('gainSlider').addEventListener('input', (e) => {
                micGainValue = parseFloat(e.target.value);
                document.getElementById('gainValue').innerText = Math.round(micGainValue * 100) + '%';
                if (micGainNode) micGainNode.gain.value = micGainValue;
            });

            document.getElementById('sysGainSlider').addEventListener('input', (e) => {
                sysGainValue = parseFloat(e.target.value);
                document.getElementById('sysGainValue').innerText = Math.round(sysGainValue * 100) + '%';
                if (sysGainNode) sysGainNode.gain.value = sysGainValue;
            });

            // PC音声チェックボックス
            document.getElementById('mixSystemAudio').addEventListener('change', (e) => {
                mixSystemAudioEnabled = e.target.checked;
                document.getElementById('sourceTargetContainer').classList.toggle('hidden', !mixSystemAudioEnabled);
            });

            // サイト完結 音抜き取りエンジン
            document.getElementById('btnSelectSource').addEventListener('click', async () => {
                try {
                    const captureStream = await navigator.mediaDevices.getDisplayMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            suppressLocalAudioPlayback: false
                        },
                        video: true
                    });

                    // 音声トラックを確保
                    const audioTracks = captureStream.getAudioTracks();

                    // 不要な映像トラック（ビデオ）はキャプチャした瞬間に即時停止・破棄
                    captureStream.getVideoTracks().forEach(track => track.stop());

                    if (audioTracks.length > 0) {
                        // 音声データだけの純粋なMediaStreamを作成
                        systemStream = new MediaStream([audioTracks[0]]);
                        const label = audioTracks[0].label || "選択された音声";
                        document.getElementById('selectedSourceLabel').innerText = `🟢 抽出完了: ${label}`;

                        // 途中で停止された場合
                        audioTracks[0].onended = () => {
                            document.getElementById('selectedSourceLabel').innerText = '選択中: 停止されました';
                            systemStream = null;
                        };
                    } else {
                        alert("⚠️ 音声が含まれていません！\n画面選択時に左下の「オーディオも共有する」にチェックを入れてください。");
                        captureStream.getTracks().forEach(t => t.stop());
                    }
                } catch (err) {
                    document.getElementById('selectedSourceLabel').innerText = '❌ 選択がキャンセルされました';
                }
            });

            // VUメーターアニメーション
            function startVuMeters() {
                const update = () => {
                    if (micAnalyser) {
                        const data = new Uint8Array(micAnalyser.frequencyBinCount);
                        micAnalyser.getByteFrequencyData(data);
                        const avg = data.reduce((a, b) => a + b, 0) / data.length;
                        const pct = Math.min(100, Math.round((avg / 128) * 100));
                        document.getElementById('micVuBar').style.width = pct + '%';
                        document.getElementById('micVuText').innerText = pct + '%';
                    }
                    if (sysAnalyser) {
                        const data = new Uint8Array(sysAnalyser.frequencyBinCount);
                        sysAnalyser.getByteFrequencyData(data);
                        const avg = data.reduce((a, b) => a + b, 0) / data.length;
                        const pct = Math.min(100, Math.round((avg / 128) * 100));
                        document.getElementById('sysVuBar').style.width = pct + '%';
                        document.getElementById('sysVuText').innerText = pct + '%';
                    }
                    requestAnimationFrame(update);
                };
                update();
            }

            // スマホ送信側
            document.getElementById('btnStartTx').addEventListener('click', async () => {
                const id = document.getElementById('roomId').value.trim();
                const status = document.getElementById('statusTx');
                if (!id) { alert("合言葉を入力してください"); return; }
                if (isTransmitting) { location.reload(); return; }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    peer = new Peer(peerConfig);
                    peer.on('open', () => {
                        peer.call('rx-' + id, stream);
                        isTransmitting = true;
                        status.innerText = "🟢 マイク送信中！";
                        document.getElementById('btnStartTx').innerText = "送信を停止";
                        document.getElementById('btnStartTx').className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                    });
                } catch (e) {
                    status.innerText = "❌ マイクの許可が必要です";
                }
            });

            // PC受信側
            document.getElementById('btnStartRx').addEventListener('click', () => {
                const id = document.getElementById('roomId').value.trim();
                const status = document.getElementById('statusRx');
                if (!id) { alert("合言葉を入力してください"); return; }
                if (isReceiving) { location.reload(); return; }

                peer = new Peer('rx-' + id, peerConfig);
                peer.on('open', () => {
                    isReceiving = true;
                    status.innerText = "🟢 接続待機中...";
                    document.getElementById('btnStartRx').innerText = "受信を停止";
                    document.getElementById('btnStartRx').className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                });

                peer.on('call', (call) => {
                    call.answer();
                    call.on('stream', (remoteStream) => {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        if (audioCtx.state === 'suspended') audioCtx.resume();

                        // 1. スマホマイク音のルーティング
                        const micSource = audioCtx.createMediaStreamSource(remoteStream);
                        micGainNode = audioCtx.createGain();
                        micGainNode.gain.value = micGainValue;
                        micAnalyser = audioCtx.createAnalyser();

                        micSource.connect(micGainNode);
                        micGainNode.connect(micAnalyser);

                        // 合成用Destination
                        const dest = audioCtx.createMediaStreamDestination();
                        micGainNode.connect(dest);

                        // 2. 抽出したPC音声のルーティング
                        if (mixSystemAudioEnabled && systemStream) {
                            try {
                                const sysSource = audioCtx.createMediaStreamSource(systemStream);
                                sysGainNode = audioCtx.createGain();
                                sysGainNode.gain.value = sysGainValue;
                                sysAnalyser = audioCtx.createAnalyser();

                                sysSource.connect(sysGainNode);
                                sysGainNode.connect(sysAnalyser);
                                sysGainNode.connect(dest);
                            } catch (e) {}
                        }

                        // 出力再生
                        const audioEl = document.getElementById('remoteAudio');
                        audioEl.srcObject = dest.stream;
                        audioEl.play().catch(() => {});

                        const deviceId = document.getElementById('audioOutputSelect').value;
                        if (deviceId && typeof audioEl.setSinkId === 'function') {
                            audioEl.setSinkId(deviceId).catch(() => {});
                        }

                        status.innerText = "🟢 接続完了！音声ミキシング再生中";
                        startVuMeters();
                    });
                });
            });
        });
    </script>
</body>
</html>
