<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホマイク中継器（システム音ミックス完全対応版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS WebRTCライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-xl font-bold mb-1 text-center text-indigo-400">スマホマイク中継器</h1>
        <p class="text-xs text-slate-400 mb-5 text-center">マイク＋システム音 リアルタイムミキサー</p>

        <!-- タブ切り替えボタン -->
        <div class="grid grid-cols-2 gap-2 mb-5 bg-slate-900 p-1 rounded-lg">
            <button type="button" id="tabTx" class="py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow">
                スマホ（送信）
            </button>
            <button type="button" id="tabRx" class="py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
                PC（受信）
            </button>
        </div>

        <!-- ルームID入力エリア -->
        <div class="mb-5 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
            <label class="block text-xs font-semibold text-slate-400 mb-1">合言葉（ルームID）</label>
            <div class="flex gap-2">
                <input type="text" id="roomId" value="mic-room-777" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="button" id="btnGenId" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs font-medium">自動生成</button>
            </div>
        </div>

        <!-- パネル1：スマホ（送信側） -->
        <div id="panelTx" class="space-y-4">
            <div class="text-xs text-slate-300 bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                ※同じWi-Fiに接続してください。
            </div>

            <!-- 音量増幅スライダー -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-300">🎤 マイク音量ブースト</label>
                    <span id="gainValue" class="text-xs font-mono font-bold text-indigo-400">100%</span>
                </div>
                <input type="range" id="gainSlider" min="0" max="8" step="0.2" value="1" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- 拡張エフェクトUI群 -->
            <div id="advancedEffectsUI" class="space-y-3 border-t border-slate-700 pt-3">
                <div class="text-[11px] text-amber-400 font-semibold">✨ 拡張エフェクト</div>
                
                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                    <label class="block text-xs font-semibold text-slate-300 mb-2">🎭 声のタイプ（プリセット）</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" data-pitch="0" class="preset-btn py-1.5 px-2 bg-indigo-600 text-white rounded text-xs font-bold transition">標準</button>
                        <button type="button" data-pitch="6" class="preset-btn py-1.5 px-2 bg-slate-700 text-slate-300 rounded text-xs font-medium hover:bg-slate-600 transition">高音 (女声風)</button>
                        <button type="button" data-pitch="-7" class="preset-btn py-1.5 px-2 bg-slate-700 text-slate-300 rounded text-xs font-medium hover:bg-slate-600 transition">低音 (男声風)</button>
                        <button type="button" data-pitch="-12" class="preset-btn py-1.5 px-2 bg-slate-700 text-slate-300 rounded text-xs font-medium hover:bg-slate-600 transition">超低音 (魔王)</button>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-300">⏩ 音声の速度（倍速）</label>
                        <span id="speedValue" class="text-xs font-mono font-bold text-indigo-400">1.0x</span>
                    </div>
                    <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <button type="button" id="btnStartTx" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                マイク送信を開始
            </button>
            <div id="statusTx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>

        <!-- パネル2：PC（受信側） -->
        <div id="panelRx" class="space-y-4 hidden">
            <div class="text-xs text-slate-300 bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                PCで再生中の音声をマイクに重ねて送信・出力できます。<br>
                <span class="text-amber-400 font-semibold">※「タブ」または「画面全体」を選び、「オーディオを共有」をオンにしてください。</span>
            </div>

            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-200 cursor-pointer" for="mixSystemAudio">
                        🎛️ PC側アプリ・タブの音声をミックス
                    </label>
                    <input type="checkbox" id="mixSystemAudio" class="w-4 h-4 accent-indigo-500 cursor-pointer">
                </div>
                
                <div id="sourceTargetContainer" class="hidden space-y-2 pt-2 border-t border-slate-800">
                    <button type="button" id="btnSelectSource" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded text-xs font-medium transition">
                        🎯 流すアプリ・タブを選択する
                    </button>
                    <div id="selectedSourceLabel" class="text-[11px] text-indigo-300 font-mono text-center truncate">選択中: なし</div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">出力デバイス選択</label>
                <select id="audioOutputSelect" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <option value="">(読み込み中...)</option>
                </select>
            </div>

            <button type="button" id="btnStartRx" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                受信スタンバイを開始
            </button>
            <div id="statusRx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>
    </div>

    <!-- 音声再生エレメント -->
    <audio id="remoteAudio" autoplay class="hidden"></audio>
    <audio id="keepAlive" loop class="hidden"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let peer = null;
            let audioCtx = null;
            let gainNode = null;
            let localStream = null;
            let systemStream = null;
            let isTransmitting = false;
            let isReceiving = false;
            
            let gainValue = 1.0;
            let speedValue = 1.0;
            let pitchValue = 0;
            let mixSystemAudioEnabled = false;

            const peerConfig = { config: { iceServers: [] } };

            // タブ切り替え
            document.getElementById('tabTx').addEventListener('click', () => {
                document.getElementById('tabTx').className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                document.getElementById('tabRx').className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                document.getElementById('panelTx').classList.remove('hidden');
                document.getElementById('panelRx').classList.add('hidden');
            });

            document.getElementById('tabRx').addEventListener('click', () => {
                document.getElementById('tabRx').className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                document.getElementById('tabTx').className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                document.getElementById('panelRx').classList.remove('hidden');
                document.getElementById('panelTx').classList.add('hidden');
            });

            // ルームID自動生成
            document.getElementById('btnGenId').addEventListener('click', () => {
                const rand = Math.floor(1000 + Math.random() * 9000);
                document.getElementById('roomId').value = 'mic-' + rand;
            });

            // 出力デバイス読み込み
            loadDevicesIntoSelect();

            async function loadDevicesIntoSelect() {
                const select = document.getElementById('audioOutputSelect');
                try {
                    const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    tempStream.getTracks().forEach(t => t.stop());

                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const outputs = devices.filter(d => d.kind === 'audiooutput');

                    select.innerHTML = '<option value="">(デフォルト出力)</option>';
                    outputs.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.deviceId;
                        opt.textContent = d.label || `スピーカー (${d.deviceId.slice(0, 5)}...)`;
                        select.appendChild(opt);
                    });
                } catch (e) {
                    select.innerHTML = '<option value="">(デバイス取得エラー・要マイク許可)</option>';
                }
            }

            // スライダー操作
            document.getElementById('gainSlider').addEventListener('input', (e) => {
                gainValue = parseFloat(e.target.value);
                const percent = Math.round(gainValue * 100);
                document.getElementById('gainValue').innerText = percent + '%';
                if (gainNode && audioCtx) {
                    gainNode.gain.setValueAtTime(gainValue, audioCtx.currentTime);
                }
            });

            document.getElementById('speedSlider').addEventListener('input', (e) => {
                speedValue = parseFloat(e.target.value);
                document.getElementById('speedValue').innerText = speedValue.toFixed(1) + 'x';
            });

            // プリセットボタン
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    pitchValue = parseInt(e.target.getAttribute('data-pitch'));
                    document.querySelectorAll('.preset-btn').forEach(b => {
                        b.className = "preset-btn py-1.5 px-2 bg-slate-700 text-slate-300 rounded text-xs font-medium hover:bg-slate-600 transition";
                    });
                    e.target.className = "preset-btn py-1.5 px-2 bg-indigo-600 text-white rounded text-xs font-bold transition";
                });
            });

            // PC側ミックス設定
            document.getElementById('mixSystemAudio').addEventListener('change', async (e) => {
                mixSystemAudioEnabled = e.target.checked;
                const targetContainer = document.getElementById('sourceTargetContainer');
                if (mixSystemAudioEnabled) {
                    targetContainer.classList.remove('hidden');
                    await selectAudioSource();
                } else {
                    targetContainer.classList.add('hidden');
                    if (systemStream) {
                        systemStream.getTracks().forEach(t => t.stop());
                        systemStream = null;
                    }
                    document.getElementById('selectedSourceLabel').innerText = '選択中: なし';
                }
            });

            document.getElementById('btnSelectSource').addEventListener('click', selectAudioSource);

            async function selectAudioSource() {
                try {
                    systemStream = await navigator.mediaDevices.getDisplayMedia({ 
                        audio: {
                            autoGainControl: false,
                            echoCancellation: false,
                            noiseSuppression: false
                        }, 
                        video: true 
                    });

                    const audioTracks = systemStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        const label = audioTracks[0].label || '選択されたソース';
                        document.getElementById('selectedSourceLabel').innerText = `🟢 選択中: ${label}`;
                        
                        audioTracks[0].onended = () => {
                            document.getElementById('selectedSourceLabel').innerText = '選択中: 停止されました';
                            document.getElementById('mixSystemAudio').checked = false;
                            mixSystemAudioEnabled = false;
                        };
                    } else {
                        alert('⚠️ 音声が含まれていません！\n共有ダイアログで「オーディオを共有」にチェックを入れたか確認してください。\n※「ウィンドウ」ではなく「タブ」または「画面全体」を選ぶと確実に音が入ります。');
                        systemStream.getTracks().forEach(t => t.stop());
                        systemStream = null;
                        document.getElementById('selectedSourceLabel').innerText = '❌ 音声共有なし (再選択してください)';
                    }
                } catch (err) {
                    document.getElementById('mixSystemAudio').checked = false;
                    mixSystemAudioEnabled = false;
                    document.getElementById('sourceTargetContainer').classList.add('hidden');
                }
            }

            // エフェクトプロセッサー
            function createEffectProcessor(ctx) {
                const bufferSize = 2048;
                const node = ctx.createScriptProcessor(bufferSize, 1, 1);
                node.onaudioprocess = function(e) {
                    const input = e.inputBuffer.getChannelData(0);
                    const output = e.outputBuffer.getChannelData(0);
                    const pitchRatio = Math.pow(2, pitchValue / 12);
                    const totalRatio = speedValue * pitchRatio;

                    for (let i = 0; i < input.length; i++) {
                        const index = Math.floor(i * totalRatio) % input.length;
                        output[i] = input[index];
                    }
                };
                return node;
            }

            // 送信トグル
            document.getElementById('btnStartTx').addEventListener('click', async () => {
                const id = document.getElementById('roomId').value.trim();
                const status = document.getElementById('statusTx');
                const btn = document.getElementById('btnStartTx');

                if (!id) { alert('合言葉を入力してください'); return; }

                if (isTransmitting) {
                    if (peer) { try { peer.destroy(); } catch(e){} }
                    if (localStream) { localStream.getTracks().forEach(t => t.stop()); }
                    if (systemStream) { systemStream.getTracks().forEach(t => t.stop()); }
                    if (audioCtx) { audioCtx.close(); }
                    isTransmitting = false;
                    btn.innerText = 'マイク送信を開始';
                    btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                    status.innerText = '状態: 停止しました';
                    return;
                }

                btn.disabled = true;
                status.innerText = 'マイクを取得中...';

                try {
                    const keep = document.getElementById('keepAlive');
                    keep.src = "data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
                    keep.play().catch(() => {});

                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                        video: false 
                    });

                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

                    const micSource = audioCtx.createMediaStreamSource(localStream);
                    gainNode = audioCtx.createGain();
                    gainNode.gain.setValueAtTime(gainValue, audioCtx.currentTime);

                    const destination = audioCtx.createMediaStreamDestination();
                    const effectProcessor = createEffectProcessor(audioCtx);

                    // マイク音声をゲイン＆エフェクトプロセッサーへ
                    micSource.connect(gainNode);
                    gainNode.connect(effectProcessor);
                    effectProcessor.connect(destination);

                    // PCシステム音が選択されている場合は並列でデスティネーションにミックス
                    if (mixSystemAudioEnabled && systemStream && systemStream.getAudioTracks().length > 0) {
                        const sysSource = audioCtx.createMediaStreamSource(systemStream);
                        const sysGain = audioCtx.createGain();
                        sysGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
                        sysSource.connect(sysGain);
                        sysGain.connect(destination);
                    }

                    status.innerText = 'ローカル接続中...';
                    if (peer) { try { peer.destroy(); } catch(e){} }

                    peer = new Peer(peerConfig);

                    peer.on('open', () => {
                        status.innerText = 'PC側へ接続中...';
                        const call = peer.call('rx-' + id, destination.stream);
                        if (!call) {
                            status.innerText = '❌ 同一Wi-Fi上のPCが見つかりません';
                            btn.disabled = false;
                            return;
                        }
                        isTransmitting = true;
                        btn.disabled = false;
                        btn.innerText = 'マイク送信を停止';
                        btn.className = "w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                        status.innerText = '🟢 送信中！（マイク＋システム音ミックス済み）';
                    });

                    peer.on('error', (err) => {
                        status.innerText = 'エラー: ' + err.type;
                        btn.disabled = false;
                    });

                } catch (e) {
                    status.innerText = '❌ マイクの許可が必要です';
                    btn.disabled = false;
                }
            });

            // 受信トグル
            document.getElementById('btnStartRx').addEventListener('click', () => {
                const id = document.getElementById('roomId').value.trim();
                const status = document.getElementById('statusRx');
                const btn = document.getElementById('btnStartRx');
                const deviceId = document.getElementById('audioOutputSelect').value;
                const audioEl = document.getElementById('remoteAudio');

                if (!id) { alert('合言葉を入力してください'); return; }

                if (isReceiving) {
                    if (peer) { try { peer.destroy(); } catch(e){} }
                    isReceiving = false;
                    btn.innerText = '受信スタンバイを開始';
                    btn.className = "w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                    status.innerText = '状態: 待機停止中';
                    return;
                }

                btn.disabled = true;
                status.innerText = '受信用IDを作成中...';

                if (peer) { try { peer.destroy(); } catch(e){} }

                peer = new Peer('rx-' + id, peerConfig);

                peer.on('open', () => {
                    isReceiving = true;
                    btn.disabled = false;
                    btn.innerText = '受信を停止';
                    btn.className = "w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                    status.innerText = '🟢 接続待ち中...';
                });

                peer.on('call', (call) => {
                    status.innerText = '接続完了！再生中...';
                    call.answer();

                    call.on('stream', async (stream) => {
                        audioEl.srcObject = stream;
                        try { await audioEl.play(); } catch (e) {}

                        if (deviceId && typeof audioEl.setSinkId === 'function') {
                            try {
                                await audioEl.setSinkId(deviceId);
                                status.innerText = '🟢 受信中（出力先適用済み）';
                            } catch (e) {
                                status.innerText = '🟢 受信中（デフォルト出力）';
                            }
                        } else {
                            status.innerText = '🟢 受信中！';
                        }
                    });
                });

                peer.on('error', (err) => {
                    status.innerText = 'エラー: ' + err.type;
                    btn.disabled = false;
                });
            });

            // 出力先リアルタイム変更
            document.getElementById('audioOutputSelect').addEventListener('change', async (e) => {
                const deviceId = e.target.value;
                const audioEl = document.getElementById('remoteAudio');
                const status = document.getElementById('statusRx');

                if (typeof audioEl.setSinkId === 'function') {
                    try {
                        await audioEl.setSinkId(deviceId);
                        status.innerText = '🟢 受信中（出力先を変更しました）';
                    } catch (e) {}
                }
            });
        });
    </script>
</body>
</html>
