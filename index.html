<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホマイク中継器（倍速・ボイチェン対応）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS WebRTCライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-xl font-bold mb-1 text-center text-indigo-400">スマホマイク中継器</h1>
        <p class="text-xs text-slate-400 mb-5 text-center">倍速・ボイスチェンジャー搭載版</p>

        <!-- タブ切り替えボタン -->
        <div class="grid grid-cols-2 gap-2 mb-5 bg-slate-900 p-1 rounded-lg">
            <button type="button" id="tabTx" onclick="switchTab('tx')" class="py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow">
                スマホ（送信）
            </button>
            <button type="button" id="tabRx" onclick="switchTab('rx')" class="py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white">
                PC（受信）
            </button>
        </div>

        <!-- ルームID入力エリア -->
        <div class="mb-5 bg-slate-900/60 p-3 rounded-lg border border-slate-700">
            <label class="block text-xs font-semibold text-slate-400 mb-1">合言葉（ルームID）</label>
            <div class="flex gap-2">
                <input type="text" id="roomId" value="mic-room-777" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="button" onclick="generateId()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs font-medium">自動生成</button>
            </div>
        </div>

        <!-- パネル1：スマホ（送信側） -->
        <div id="panelTx" class="space-y-4">
            <div class="text-xs text-slate-300 bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                ※同じWi-Fiに接続してください。送信中いつでも音量・倍速・声を変更できます。
            </div>

            <!-- 音量増幅スライダー -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-300">🎤 マイク音量（ブースト）</label>
                    <span id="gainValue" class="text-xs font-mono font-bold text-indigo-400">100%</span>
                </div>
                <input type="range" id="gainSlider" min="0" max="4" step="0.1" value="1" oninput="updateGain(this.value)" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- 倍速（再生速度）スライダー -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-300">⏩ 音声の速度（倍速）</label>
                    <span id="speedValue" class="text-xs font-mono font-bold text-indigo-400">1.0x (等速)</span>
                </div>
                <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeed(this.value)" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                    <span>0.5x (スロー)</span>
                    <span>1.0x</span>
                    <span>1.5x</span>
                    <span>2.0x (2倍速)</span>
                </div>
            </div>

            <!-- ボイスチェンジャー（ピッチ調整） -->
            <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-semibold text-slate-300">🎭 ボイスチェンジ（声の高さ）</label>
                    <span id="pitchValue" class="text-xs font-mono font-bold text-indigo-400">標準 (±0)</span>
                </div>
                <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" oninput="updatePitch(this.value)" class="w-full accent-indigo-500 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                    <span>低音 (-12)</span>
                    <span>標準 (0)</span>
                    <span>高音 (+12)</span>
                </div>
            </div>

            <button type="button" id="btnStartTx" onclick="toggleTransmitter()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                マイク送信を開始
            </button>
            <div id="statusTx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>

        <!-- パネル2：PC（受信側） -->
        <div id="panelRx" class="space-y-4 hidden">
            <div class="text-xs text-slate-300 bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-lg">
                「受信を開始」を押したあとでも、下のプルダウンから<strong>いつでも自由に出力先を変更</strong>できます。
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">出力デバイス選択（リアルタイム変更可）</label>
                <select id="audioOutputSelect" onchange="changeOutputDevice(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <option value="">(読み込み中...)</option>
                </select>
            </div>

            <button type="button" id="btnStartRx" onclick="toggleReceiver()" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg">
                受信スタンバイを開始
            </button>
            <div id="statusRx" class="text-center text-xs text-amber-400 font-mono p-2 bg-slate-900/80 rounded">状態: 待機中</div>
        </div>
    </div>

    <!-- 音声再生エレメント -->
    <audio id="remoteAudio" autoplay class="hidden"></audio>
    <audio id="keepAlive" loop class="hidden"></audio>

    <script>
        let peer = null;
        let audioCtx = null;
        let gainNode = null;
        let localStream = null;
        let isTransmitting = false;
        let isReceiving = false;
        
        let gainValue = 1.0;
        let speedValue = 1.0;
        let pitchValue = 0;

        const peerConfig = {
            config: {
                iceServers: [] // 同一Wi-Fi限定
            }
        };

        function switchTab(mode) {
            const tabTx = document.getElementById('tabTx');
            const tabRx = document.getElementById('tabRx');
            const panelTx = document.getElementById('panelTx');
            const panelRx = document.getElementById('panelRx');

            if (mode === 'tx') {
                tabTx.className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                tabRx.className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                panelTx.classList.remove('hidden');
                panelRx.classList.add('hidden');
            } else {
                tabRx.className = "py-2.5 rounded-md font-bold text-xs bg-indigo-600 text-white shadow";
                tabTx.className = "py-2.5 rounded-md font-bold text-xs text-slate-400 hover:text-white";
                panelRx.classList.remove('hidden');
                panelTx.classList.add('hidden');
            }
        }

        function generateId() {
            const rand = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('roomId').value = 'mic-' + rand;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadDevicesIntoSelect();
        });

        async function loadDevicesIntoSelect() {
            const select = document.getElementById('audioOutputSelect');
            try {
                const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                tempStream.getTracks().forEach(t => t.stop());

                const devices = await navigator.mediaDevices.enumerateDevices();
                const outputs = devices.filter(d => d.kind === 'audiooutput');

                select.innerHTML = '<option value="">(デフォルト出力)</option>';
                outputs.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.textContent = d.label || `スピーカー (${d.deviceId.slice(0, 5)}...)`;
                    select.appendChild(opt);
                });
            } catch (e) {
                select.innerHTML = '<option value="">(デバイス取得エラー・要マイク許可)</option>';
            }
        }

        // --- 送信側のパラメータリアルタイム変更 ---
        function updateGain(val) {
            gainValue = parseFloat(val);
            const percent = Math.round(gainValue * 100);
            document.getElementById('gainValue').innerText = percent + '%';
            if (gainNode && audioCtx) {
                gainNode.gain.setValueAtTime(gainValue, audioCtx.currentTime);
            }
        }

        function updateSpeed(val) {
            speedValue = parseFloat(val);
            document.getElementById('speedValue').innerText = speedValue.toFixed(1) + 'x';
        }

        function updatePitch(val) {
            pitchValue = parseInt(val);
            const label = pitchValue > 0 ? `+${pitchValue} (高音)` : pitchValue < 0 ? `${pitchValue} (低音)` : '標準 (±0)';
            document.getElementById('pitchValue').innerText = label;
        }

        // 倍速＆ピッチ変更を同時に行うリアルタイムエフェクトプロセッサー
        function createEffectProcessor(ctx) {
            const bufferSize = 2048;
            const node = ctx.createScriptProcessor(bufferSize, 1, 1);

            node.onaudioprocess = function(e) {
                const input = e.inputBuffer.getChannelData(0);
                const output = e.outputBuffer.getChannelData(0);

                // ピッチ補正の倍率計算 (-12 〜 +12 半音)
                const pitchRatio = Math.pow(2, pitchValue / 12);
                const totalRatio = speedValue * pitchRatio;

                for (let i = 0; i < input.length; i++) {
                    const index = Math.floor(i * totalRatio) % input.length;
                    output[i] = input[index];
                }
            };
            return node;
        }

        async function toggleTransmitter() {
            const id = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusTx');
            const btn = document.getElementById('btnStartTx');

            if (!id) { alert('合言葉を入力してください'); return; }

            if (isTransmitting) {
                if (peer) { try { peer.destroy(); } catch(e){} }
                if (localStream) { localStream.getTracks().forEach(t => t.stop()); }
                if (audioCtx) { audioCtx.close(); }
                isTransmitting = false;
                btn.innerText = 'マイク送信を開始';
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                status.innerText = '状態: 停止しました';
                return;
            }

            btn.disabled = true;
            status.innerText = 'マイクを取得中...';

            try {
                const keep = document.getElementById('keepAlive');
                keep.src = "data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
                keep.play().catch(() => {});

                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false }, 
                    video: false 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') { await audioCtx.resume(); }

                const source = audioCtx.createMediaStreamSource(localStream);
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(gainValue, audioCtx.currentTime);

                const effectProcessor = createEffectProcessor(audioCtx);
                const destination = audioCtx.createMediaStreamDestination();
                
                // マイク -> 音量調整 -> 倍速＆ボイチェンエフェクト -> 送信先
                source.connect(gainNode);
                gainNode.connect(effectProcessor);
                effectProcessor.connect(destination);

                status.innerText = 'ローカル接続中...';
                if (peer) { try { peer.destroy(); } catch(e){} }

                peer = new Peer(peerConfig);

                peer.on('open', () => {
                    status.innerText = 'PC側へ接続中...';
                    const call = peer.call('rx-' + id, destination.stream);
                    if (!call) {
                        status.innerText = '❌ 同一Wi-Fi上のPCが見つかりません';
                        btn.disabled = false;
                        return;
                    }
                    isTransmitting = true;
                    btn.disabled = false;
                    btn.innerText = 'マイク送信を停止';
                    btn.className = "w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                    status.innerText = '🟢 送信中！（倍速・ボイチェン有効）';
                });

                peer.on('error', (err) => {
                    status.innerText = 'エラー: ' + err.type;
                    btn.disabled = false;
                });

            } catch (e) {
                status.innerText = '❌ マイクの許可が必要です';
                btn.disabled = false;
            }
        }

        // --- 受信側（PC） ---
        async function changeOutputDevice(deviceId) {
            const audioEl = document.getElementById('remoteAudio');
            const status = document.getElementById('statusRx');

            if (typeof audioEl.setSinkId === 'function') {
                try {
                    await audioEl.setSinkId(deviceId);
                    status.innerText = '🟢 受信中（出力先を変更しました）';
                } catch (e) {
                    console.error("出力先変更エラー:", e);
                }
            }
        }

        function toggleReceiver() {
            const id = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusRx');
            const btn = document.getElementById('btnStartRx');
            const deviceId = document.getElementById('audioOutputSelect').value;
            const audioEl = document.getElementById('remoteAudio');

            if (!id) { alert('合言葉を入力してください'); return; }

            if (isReceiving) {
                if (peer) { try { peer.destroy(); } catch(e){} }
                isReceiving = false;
                btn.innerText = '受信スタンバイを開始';
                btn.className = "w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                status.innerText = '状態: 待機停止中';
                return;
            }

            btn.disabled = true;
            status.innerText = '受信用IDを作成中...';

            if (peer) { try { peer.destroy(); } catch(e){} }

            peer = new Peer('rx-' + id, peerConfig);

            peer.on('open', () => {
                isReceiving = true;
                btn.disabled = false;
                btn.innerText = '受信を停止';
                btn.className = "w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg";
                status.innerText = '🟢 同一Wi-Fiからの接続待ち中...';
            });

            peer.on('call', (call) => {
                status.innerText = '接続完了！音声を再生中...';
                call.answer();

                call.on('stream', async (stream) => {
                    audioEl.srcObject = stream;
                    try { await audioEl.play(); } catch (e) {}

                    if (deviceId && typeof audioEl.setSinkId === 'function') {
                        try {
                            await audioEl.setSinkId(deviceId);
                            status.innerText = '🟢 音声受信中（指定出力先へ送信中）';
                        } catch (e) {
                            status.innerText = '🟢 音声受信中（デフォルト出力）';
                        }
                    } else {
                        status.innerText = '🟢 音声受信中！';
                    }
                });
            });

            peer.on('error', (err) => {
                status.innerText = 'エラー: ' + err.type;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
