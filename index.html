<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイクテスト用</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700 text-center">
        <h1 class="text-xl font-bold mb-4 text-indigo-400">マイク動作テスト</h1>
        
        <p class="text-xs text-slate-400 mb-6">
            下のボタンを押してマイクが正常に反応するかテストします。
        </p>

        <button id="micButton" onclick="toggleMic()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg mb-4">
            マイクをONにする
        </button>

        <div id="status" class="text-xs text-amber-400 font-mono p-2 bg-slate-900 rounded">
            状態: 停止中
        </div>

        <!-- 音声確認用 -->
        <audio id="localAudio" autoplay muted class="mt-4 w-full hidden"></audio>
    </div>

    <script>
        let mediaStream = null;

        async function toggleMic() {
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('micButton');
            const audioEl = document.getElementById('localAudio');

            if (!mediaStream) {
                try {
                    statusDiv.innerText = 'マイク権限をリクエスト中...';
                    
                    // ブラウザにマイクの許可を求める
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true }, 
                        video: false 
                    });

                    // 成功したら音声要素に流す（テスト用）
                    audioEl.srcObject = mediaStream;
                    
                    statusDiv.innerText = '🟢 マイク作動中！音声入力テストOK';
                    btn.innerText = 'マイクをOFFにする';
                    btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg mb-4";

                } catch (err) {
                    console.error(err);
                    statusDiv.innerText = '❌ エラー: マイクが許可されませんでした (' + err.message + ')';
                }
            } else {
                // 停止処理
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                audioEl.srcObject = null;

                statusDiv.innerText = '状態: 停止中';
                btn.innerText = 'マイクをONにする';
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition text-sm shadow-lg mb-4";
            }
        }
    </script>
</body>
</html>
