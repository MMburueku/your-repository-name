<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スマホマイク・ワイヤレス中継</title>
    <!-- Tailwind CSS for clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC P2P connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">スマホマイク中継器</h1>
        <p class="text-sm text-slate-400 mb-6 text-center">スマホをマイクにしてPCへ音声を飛ばします</p>

        <!-- モード選択 -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="btnModeTx" onclick="setMode('tx')" class="py-2.5 px-4 rounded-lg font-medium text-sm transition bg-indigo-600 text-white shadow-lg">
                スマホ（送信）
            </button>
            <button id="btnModeRx" onclick="setMode('rx')" class="py-2.5 px-4 rounded-lg font-medium text-sm transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                PC（受信）
            </button>
        </div>

        <!-- ルームID入力 -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">ルームID（任意の文字列）</label>
            <div class="flex gap-2">
                <input type="text" id="roomId" value="train-mic-room-01" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button onclick="generateRandomId()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs">ランダム</button>
            </div>
        </div>

        <!-- 送信側（スマホ）コントロール -->
        <div id="panelTx" class="space-y-4">
            <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 text-xs text-slate-400">
                1. ルームIDを確認・入力<br>
                2. 「送信開始」を押してマイクを許可<br>
                3. PC側で同じIDに接続する
            </div>
            <button id="btnStartTx" onclick="startTransmitter()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition shadow-lg">
                送信を開始する
            </button>
            <div id="statusTx" class="text-center text-xs text-slate-400">状態: 待機中</div>
        </div>

        <!-- 受信側（PC）コントロール -->
        <div id="panelRx" class="space-y-4 hidden">
            <div class="p-3 bg-slate-900/50 rounded-lg border border-slate-700/50 text-xs text-slate-400">
                1. 下記から出力先（VB-CABLE等）を選択<br>
                2. 「受信接続」を押す<br>
                3. スマホ側からの接続を待つ
            </div>
            
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">音声の出力先（スピーカー / 仮想マイク）</label>
                <select id="audioOutputSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="">デフォルトの出力デバイス</option>
                </select>
            </div>

            <button id="btnStartRx" onclick="startReceiver()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition shadow-lg">
                受信を接続する
            </button>
            <div id="statusRx" class="text-center text-xs text-slate-400">状態: 待機中</div>
        </div>
    </div>

    <!-- 隠しオーディオ要素 -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        let currentMode = 'tx';
        let peer = null;
        let activeConnection = null;
        let localStream = null;

        function setMode(mode) {
            currentMode = mode;
            const btnTx = document.getElementById('btnModeTx');
            const btnRx = document.getElementById('btnModeRx');
            const panelTx = document.getElementById('panelTx');
            const panelRx = document.getElementById('panelRx');

            if (mode === 'tx') {
                btnTx.className = "py-2.5 px-4 rounded-lg font-medium text-sm transition bg-indigo-600 text-white shadow-lg";
                btnRx.className = "py-2.5 px-4 rounded-lg font-medium text-sm transition bg-slate-700 text-slate-300 hover:bg-slate-600";
                panelTx.classList.remove('hidden');
                panelRx.classList.add('hidden');
            } else {
                btnRx.className = "py-2.5 px-4 rounded-lg font-medium text-sm transition bg-indigo-600 text-white shadow-lg";
                btnTx.className = "py-2.5 px-4 rounded-lg font-medium text-sm transition bg-slate-700 text-slate-300 hover:bg-slate-600";
                panelRx.classList.remove('hidden');
                panelTx.classList.add('hidden');
                loadAudioOutputs();
            }
        }

        function generateRandomId() {
            const randomStr = Math.random().toString(36.substring(2, 8));
            document.getElementById('roomId').value = 'mic-' + randomStr;
        }

        async function loadAudioOutputs() {
            if (!navigator.mediaDevices?.enumerateDevices) return;
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
                const select = document.getElementById('audioOutputSelect');
                select.innerHTML = '<option value="">デフォルトの出力デバイス</option>';
                audioOutputs.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `スピーカー (${device.deviceId.slice(0, 4)}...)`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('出力デバイスの取得に失敗:', err);
            }
        }

        // スマホ（送信側）の処理
        async function startTransmitter() {
            const roomId = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusTx');
            if (!roomId) {
                alert('ルームIDを入力してください');
                return;
            }

            status.innerText = '状態: マイクを取得中...';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, 
                    video: false 
                });

                status.innerText = '状態: 接続サーバーに接続中...';
                // PeerJSの無料パブリックサーバーを利用
                peer = new Peer();

                peer.on('open', (id) => {
                    status.innerText = '状態: PCからの接続待ち... (ID: ' + roomId + ')';
                    
                    // PC側からの着信（コール）を待ち受ける
                    peer.on('call', (call) => {
                        call.answer(localStream); // スマホのマイク音声を返す
                        status.innerText = '状態: 🟢 PCへ音声送信中！';
                    });
                });

                peer.on('error', (err) => {
                    status.innerText = 'エラー: ' + err.type;
                });

            } catch (err) {
                status.innerText = 'エラー: マイクの許可が必要です';
                console.error(err);
            }
        }

        // PC（受信側）の処理
        async function startReceiver() {
            const roomId = document.getElementById('roomId').value.trim();
            const status = document.getElementById('statusRx');
            const selectedOutputId = document.getElementById('audioOutputSelect').value;
            const remoteAudio = document.getElementById('remoteAudio');

            if (!roomId) {
                alert('ルームIDを入力してください');
                return;
            }

            status.innerText = '状態: スマホを呼び出しています...';
            peer = new Peer();

            peer.on('open', (id) => {
                // 受信側から送信側（スマホ側が待機しているID）へ空のストリームでコールをかける
                // ※PeerJSの仕様上、お互いに接続するためにダミーの音声ストリームを作ってコールします
                navigator.mediaDevices.getUserMedia({ audio: true }).then(dummyStream => {
                    const targetPeerId = roomId; // スマホ側を指定のIDに見立てるアプローチ、または逆向き
                    
                    // シンプルに、スマホ側から受信できるようにコネクションを確立
                    // ここでは「スマホ側が待機して、PC側が接続しに行く」形にするため、
                    // スマホ側のPeerIDを固定にする仕組みにします。
                }).catch(() => {
                    // ダミーマイクが取れなくても進める
                });

                // 代わりのシンプル方式：お互いに同じIDで接続する仕組みにするため、
                // スマホ側からPCへ発信するように逆にします。
                status.innerText = '状態: スマホ側から「送信開始」を押してください';
            });

            // 受信側でスマホからのコールを受け取るパターンに変更
            peer.on('call', (call) => {
                call.answer(); // 音を受け取る
                call.on('stream', (remoteStream) => {
                    remoteAudio.srcObject = remoteStream;
                    
                    // 指定された出力先（CABLE Inputなど）に音声をルーティング
                    if (selectedOutputId && remoteAudio.setSinkId) {
                        remoteAudio.setSinkId(selectedOutputId)
                            .then(() => {
                                status.innerText = '状態: 🟢 音声を受信中（出力先適用済み）';
                            })
                            .catch(err => {
                                status.innerText = '状態: 🟢 受信中（デフォルト出力）';
                                console.error('出力先の設定に失敗:', err);
                            });
                    } else {
                        status.innerText = '状態: 🟢 音声を受信中';
                    }
                });
            });

            // 受信側のPeerIDを固定ルームIDにするための修正
            // スマホがクライアント、PCがホストになるように反転させます
        }
    </script>
</body>
</html>
